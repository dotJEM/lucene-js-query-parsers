<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TESTER</title>
    <script src="../dist/webpack/dotJEM-ordering-lucene-query-parsers.js"></script>
</head>
<body>
    <div>
        <input id="query" type="text" style="width: 100%; height: 32px;">
    </div>
    <pre id="string"></pre>
    <pre id="json"></pre>

    <script>
        const elm = document.getElementById('query');
        const outStr = document.getElementById('string');
        const outJson = document.getElementById('json');
        const parser = new dotjem.lucene.OrderingQueryParser();
        elm.addEventListener('input', inputHandler);
        elm.value = "name: Peter AND age: [5 TO 15] AND class:(Math OR Gymnastics)";
        function inputHandler(e) {
            const query = parser.parse(elm.value);
            outStr.innerText = query.toString();
            outJson.innerText = JSON.stringify(query, null,  4);
        }

        inputHandler();
    </script>
</body>
</html>
